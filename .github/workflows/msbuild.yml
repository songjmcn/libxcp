# Windows / MSBuild 持续集成（第一阶段仅 master；后续把 branches 过滤去掉即可扩展到所有分支）
name: MSBuild

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BOOST_VERSION: 1.86.0

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 预编译 Boost 1.86.0（MSVC 14.3，静态库 + 动态 CRT），自带 lib/cmake/Boost-1.86.0 配置包
      - name: 安装 Boost ${{ env.BOOST_VERSION }}
        id: install-boost
        uses: MarkusJx/install-boost@v2.4.5
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          platform_version: 2022
          toolset: msvc
          link: static
          boost_install_dir: C:\boost

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -S .
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLIBXCP_BUILD_TESTS=OFF
          -DLIBXCP_BUILD_TOOLS=ON
          -DLIBXCP_BUILD_EXAMPLES=ON
          -DLIBXCP_ENABLE_LOG=ON
          -DBoost_USE_STATIC_LIBS=ON
          "-DBoost_DIR=${{ steps.install-boost.outputs.BOOST_ROOT }}/lib/cmake/Boost-${{ env.BOOST_VERSION }}"

      # 不加 -j：VS 生成器下并行构建会在 ZERO_CHECK 解析阶段失败（见 CMakeLists.txt 头注释）
      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE
