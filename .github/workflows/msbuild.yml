# Windows / MSBuild 持续集成（第一阶段仅 master；后续把 branches 过滤去掉即可扩展到所有分支）
name: MSBuild

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  BOOST_VERSION: 1.86.0

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 预编译包（MarkusJx/install-boost）实测不可用：包内是 x86 且依赖符号链接，7-Zip 解压失败。
      # 改为用官方源码包 + b2 编译 Boost 1.86.0（x64，静态库 + 动态 CRT），并缓存安装目录。
      - name: 缓存 Boost
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: C:\boost
          key: boost-${{ env.BOOST_VERSION }}-msvc-x64-static-md-v1

      - name: 编译安装 Boost ${{ env.BOOST_VERSION }}
        if: steps.boost-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = "${{ env.BOOST_VERSION }}"
          $under = $ver -replace '\.', '_'
          $zip = "$env:RUNNER_TEMP\boost.zip"
          Invoke-WebRequest -Uri "https://archives.boost.io/release/$ver/source/boost_$under.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          Set-Location "$env:RUNNER_TEMP\boost_$under"
          cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && bootstrap.bat vc143 && b2 install --prefix=C:\boost --with-locale --with-filesystem --with-process toolset=msvc-14.3 address-model=64 variant=release link=static runtime-link=shared threading=multi -j4"
          if ($LASTEXITCODE -ne 0) { throw "Boost 编译失败" }

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -S .
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLIBXCP_BUILD_TESTS=ON
          -DLIBXCP_BUILD_TOOLS=ON
          -DLIBXCP_BUILD_EXAMPLES=ON
          -DLIBXCP_ENABLE_LOG=ON
          -DBoost_USE_STATIC_LIBS=ON
          "-DBoost_DIR=C:/boost/lib/cmake/Boost-${{ env.BOOST_VERSION }}"

      # 不加 -j：VS 生成器下并行构建会在 ZERO_CHECK 解析阶段失败（见 CMakeLists.txt 头注释）
      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE

      # 必须带 -C：VS 是多配置生成器，缺省会报 "Test not available without configuration"。
      # 耗时类用例只在本地做门禁（计划文档 §8.3.4）；串行执行避免 Examples 抢端口 5555。
      # --timeout 180：与 Linux/macOS 对齐，让挂死用例 3 分钟内被点名而不是烧掉 10 分钟。
      # timeout-minutes：整轮若仍被某个用例挂住，20 分钟后由 job 层面截断并进入
      # Annotate failures，避免白占 runner 到 90 分钟的作业上限。
      # 超时预算（三级，必须 watchdog < ctest < 步骤）：
      #   看门狗 60 s —— 用例挂死时由测试进程自己点名并 abort；
      #   ctest 90 s —— 兜底杀掉整个进程（含看门狗没覆盖到的卡死）；
      #   步骤 60 min —— 即使有二十多个用例各拖 90 s 也能跑完并产出失败清单。
      # 上一轮因为步骤只有 20 min，整轮被截断，注解里只剩“步骤超时”，看不到用例名。
      # 诊断步骤：单跑一个挂死用例，并把最后几条 TRACE 埋点打成注解。
      # TRACE 由 tests/tcp_transport_test.cpp 的 Trace() 在 LIBXCP_TEST_TRACE
      # 下输出，用来看清用例卡在 accept/connect/send/recv 的哪一步。
      - name: Diagnose TCP end-to-end failures
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 8
        env:
          LIBXCP_TEST_WATCHDOG_SECONDS: 40
          LIBXCP_TEST_TRACE: 1
        run: |
          $exe = (Get-ChildItem -Path build -Recurse -Filter libxcp_tests.exe | Select-Object -First 1).FullName
          Write-Host ("::error::exe=" + $exe)
          if (-not $exe) { exit 1 }
          $case = "TcpEndToEndTest.MasterSendsAsamV14FrameWithoutTail"
          $out = & $exe --gtest_filter=$case 2>&1 | Out-String
          Write-Host ("::error::" + $case + " exit=" + $LASTEXITCODE)
          ($out -split "`n") |
            Where-Object { $_ -match 'TRACE|WATCHDOG|Failure|Expected' } |
            Select-Object -Last 7 |
            ForEach-Object { Write-Host ("::error::T| " + $_.Trim()) }

      - name: Test
        working-directory: build
        shell: pwsh
        timeout-minutes: 45
        env:
          # 用例级看门狗（tests/test_main.cpp）：单用例超过该秒数即打印用例名并中止。
          LIBXCP_TEST_WATCHDOG_SECONDS: 60
        run: >
          ctest -C $env:BUILD_TYPE --output-on-failure --timeout 90
          -E "XcpMasterRenderBenchTest|a2l_ui_perf_gen|a2l_perf_gen|ParseLargeFileUnderBudget"

      # 失败时把 ctest 的失败清单打成 GitHub 注解（annotation）。
      # 注解可由匿名 API 读取（/repos/.../check-runs/{id}/annotations），
      # 因此即使没有仓库权限也能定位到底哪些用例红了。
      - name: Annotate failures
        if: failure()
        working-directory: build
        shell: pwsh
        run: |
          $log = 'Testing/Temporary/LastTestsFailed.log'
          if (Test-Path $log) {
            Get-Content $log | Where-Object { $_ -match '\S' } | ForEach-Object {
              Write-Host "::error title=ctest failure::$_"
            }
          }
