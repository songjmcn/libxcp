# macOS 持续集成（第二阶段：三平台都跑 Test）
name: macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build-macos:
    # macOS 26 镜像自带 Apple Clang 21.0.0，其 libc++ 已完整支持 C++20 <format>
    # （日志头 include/libxcp/log.hpp 依赖它），因此不再需要 brew 安装 LLVM。
    #
    # 历史坑：此前用 macos-14 + brew LLVM，只给 -nostdinc++ 与 -L 会形成
    # "系统 clang 驱动 + brew libc++ 头 + 按 install name 解析到的系统 libc++abi"
    # 的混搭，使 __cxa_throw 与 __cxa_begin_catch 落在两套 libc++abi 实例上，
    # 整个二进制的异常捕获失效（连 EXPECT_THROW 都接不住）。
    # 详见 code-plan/TCP_UDP平台隔离重构_实施计划_POD接口与平台分文件.md §8.3.9。
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 镜像自带 CMake 3.31/4.1、Ninja 1.13 与 Apple Clang 21，只缺 Boost
      - name: 安装 Boost
        run: brew install boost

      # Boost_DIR 由 brew 前缀下的 Boost-* 目录通配得到，不写死版本号
      - name: Configure
        run: |
          BOOST_CMAKE_DIR="$(ls -d "$(brew --prefix boost)"/lib/cmake/Boost-* | head -n 1)"
          echo "BOOST_CMAKE_DIR=$BOOST_CMAKE_DIR"
          # 与 Linux 同理：构建期 gtest 发现与 ctest 运行时都要能找到 brew 安装的 Boost 动态库
          echo "BOOST_LIB_DIR=$(brew --prefix boost)/lib" >> "$GITHUB_ENV"
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DLIBXCP_BUILD_TESTS=ON \
            -DLIBXCP_BUILD_TOOLS=ON \
            -DLIBXCP_BUILD_EXAMPLES=ON \
            -DLIBXCP_ENABLE_LOG=ON \
            "-DBoost_DIR=$BOOST_CMAKE_DIR"

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      # TODO: 定位完成后删除。确认二进制只依赖系统 libc++（不应再出现 brew 的 libc++）。
      - name: Diagnose libc++ runtime (temporary)
        continue-on-error: true
        run: |
          echo "=== 编译器 ==="
          c++ --version | head -2
          echo "=== otool -L build/tests/libxcp_tests ==="
          otool -L build/tests/libxcp_tests | grep -E 'c\+\+' || echo "(无 c++ 动态依赖)"
          echo "=== 单个抛异常用例（应 PASSED） ==="
          ./build/tests/libxcp_tests \
            --gtest_filter=CommandCodecBoundary.UploadRejectsZeroAndOverOneByte 2>&1 | tail -5

      # 耗时类用例只在本地做门禁（计划文档 §8.3.4）：渲染基准与两处 A2L 规模/耗时断言不进 CI。
      # 串行执行：Examples 并行会抢默认端口 5555，产生假失败。
      # --timeout 180：本机最慢用例 10 s，CI 慢 5 倍也才 50 s；留 180 s 足以容忍抖动，又能让真正
      #   挂死的用例在 3 分钟内被点名（此前 600 s，5 个挂死用例就烧掉 50 分钟）。
      # 首轮 continue-on-error：此前该 job 只编译不测试，既有失败需先分类；基线稳定后移除，转为硬门。
      - name: Test
        continue-on-error: true
        working-directory: build
        env:
          DYLD_LIBRARY_PATH: ${{ env.BOOST_LIB_DIR }}
        run: >
          ctest --output-on-failure --timeout 180
          -E "XcpMasterRenderBenchTest|a2l_ui_perf_gen|a2l_perf_gen|ParseLargeFileUnderBudget"
