<text x="98" y="592" fill="#6ee7df" font-size="32">128</text>
<text x="280" y="590" fill="#b9cadb" font-size="18">无单位</text>
<text x="555" y="586" fill="#a6d4c8" font-size="19">采样中 · 有效</text>
<text x="935" y="586" fill="#dce5ef" font-size="19">18:30:01.200</text>
<text x="98" y="626" fill="#b9cadb" font-size="16">来源：POLL  |  标量直接显示单值，不显示数组索引或分页控件</text>
<text x="50" y="687" fill="#dce5ef" font-size="19">▸  [✓]  cpp_demo::temperature     MEAS · UBYTE · 标量              采样中（已折叠）</text>
<text x="78" y="735" fill="#f2cb75" font-size="17">已折叠变量继续采样，但不显示数值；选中该行后按 Enter 展开。</text>
<text x="78" y="766" fill="#93a5ba" font-size="16">stop 后保留最近值及时间，明确标记“已停止 / 旧值”，不伪装为实时数据。</text>
<rect x="36" y="786" width="1368" height="36" rx="5" fill="#1e3048"/>
<text x="48" y="811" fill="#dce5ef" font-size="18">命令 &gt; </text>
<text x="48" y="852" fill="#6ee7df" font-size="16">Enter 展开/折叠   F6 成员切换   F4 标定   F3 只读详情   F5 停止   F2 切换视图</text>
<text x="36" y="904" fill="#93a5ba" font-size="16">列表快捷键：Ctrl+A / ⌘A 管理观测，Ctrl+S / ⌘S 进入标定；只读变量拒绝申请写入。</text>
