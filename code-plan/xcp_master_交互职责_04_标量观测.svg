<text x="98" y="398" fill="#6ee7df" font-size="32">42.50</text>
<text x="280" y="396" fill="#b9cadb" font-size="18">km/h</text>
<text x="555" y="392" fill="#a6d4c8" font-size="19">采样中 · 有效</text>
<text x="935" y="392" fill="#dce5ef" font-size="19">18:30:01.200</text>
<text x="98" y="439" fill="#b9cadb" font-size="16">来源：POLL  |  读取能力：支持  |  标定能力：只读 MEASUREMENT</text>
<text x="50" y="499" fill="#dce5ef" font-size="19">▾  [✓]  cpp_demo::counter         MEAS · UWORD · 标量              采样中</text>
<rect x="74" y="519" width="1290" height="126" rx="5" fill="#17283b"/>
